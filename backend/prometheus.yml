global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: "olx-backend"
    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "host.docker.internal:5005"